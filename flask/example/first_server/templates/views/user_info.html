{% extends "includes/_base.html" %}

{% block title %}User Infos{% endblock %}

{% block content %}
  <table>
    <thead>
      <tr>
        <th>Key</th>
        <th>Value</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="col">Firstname</th>
        <td>{{ firstname }}</td>
      </tr>
      <tr>
        <th scope="col">Lastname</th>
        <td>{{ lastname }}</td>
      </tr>
      <tr>
        <th scope="col">Email</th>
        <td>{{ email }}</td>
      </tr>
      <tr>
        <th scope="col">Age</th>
        <td>{{ age }}</td>
      </tr>
    </tbody>
  </table>
{% endblock %}
