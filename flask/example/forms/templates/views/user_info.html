{% extends "includes/_base.html" %}

{% block title %}User Info{% endblock %}
{% block content %}
<table class="table table-hover mt-5">
    <tbody>
      <tr>
        <th>
          Firstname
        </th>
        <td>
          {{ firstname }}
        </td>
      </tr>
      <tr>
        <th>
          Lastname
        </th>
        <td>
          {{ lastname }}
        </td>
      </tr>
      <tr>
        <th>
          Email
        </th>
        <td>
          {{ email }}
        </td>
      </tr>
      <tr>
        <th>
          Age
        </th>
        <td>
          {{ age }}
        </td>
      </tr>
    </tbody>
  </table>
{% endblock %}
