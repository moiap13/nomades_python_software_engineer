{% extends 'includes/_base.html' %}

{% block title %}All Users{% endblock %}
{% block content %}
  <h1>All users</h1>

  <ul>
    {% for user in users %}
      <li>
        <a href="{{ url_for('user.get_posts_per_user', user_id=user.id) }}">{{ user.uid }}</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
